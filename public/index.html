<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scribble Squad</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="home-card">
      <h1 class="logo">Scribble<span>Squad</span></h1>
      <p class="tag">Draw it. Guess it. Brag about it.</p>
      <label class="field">
        <span>Your name</span>
        <input id="nameInput" maxlength="16" placeholder="e.g. Picasso Jr" autocomplete="off">
      </label>
      <button id="createBtn" class="btn big primary">✨ Create a game</button>
      <div class="or"><span>or join with a code</span></div>
      <div class="join-row">
        <input id="codeInput" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
        <button id="joinBtn" class="btn big">Join</button>
      </div>
      <p id="homeError" class="error"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="screen">
    <div class="lobby-wrap">
      <div class="panel invite">
        <h2>Invite your squad</h2>
        <p class="muted">Share the code, the link, or let them scan the QR.</p>
        <div class="code-display" id="lobbyCode">----</div>
        <img id="qrImg" class="qr" alt="QR code to join this game">
        <div class="link-row">
          <input id="joinLink" readonly>
          <button id="copyBtn" class="btn">Copy</button>
        </div>
        <p id="lanNote" class="muted small"></p>
      </div>
      <div class="panel">
        <h2>Players <span id="playerCount" class="pill">0</span></h2>
        <ul id="lobbyPlayers" class="lobby-players"></ul>
        <div id="hostSettings" class="settings">
          <label>Rounds
            <select id="roundsSel">
              <option>1</option><option>2</option><option selected>3</option><option>4</option>
              <option>5</option><option>6</option><option>8</option><option>10</option>
            </select>
          </label>
          <label>Draw time
            <select id="timeSel">
              <option value="30">30s</option><option value="45">45s</option><option value="60">60s</option>
              <option value="80" selected>80s</option><option value="100">100s</option>
              <option value="120">120s</option><option value="150">150s</option>
            </select>
          </label>
        </div>
        <p id="settingsInfo" class="muted"></p>
        <button id="startBtn" class="btn big primary">🚀 Start game</button>
        <p id="waitHost" class="muted center">Waiting for the host to start…</p>
        <button id="leaveBtn" class="btn ghost">Leave</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <header class="topbar">
      <div class="round" id="roundLabel">Round 1/3</div>
      <div class="word" id="wordLabel"></div>
      <div class="timer" id="timer"><span id="timerNum">80</span></div>
    </header>
    <div class="game-grid">
      <aside class="players-col"><ul id="gamePlayers"></ul></aside>
      <main class="board-col">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas" width="800" height="600"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
        <div class="tools" id="tools">
          <div class="colors" id="colors"></div>
          <div class="sizes" id="sizes"></div>
          <div class="tool-btns">
            <button class="tool" data-tool="pen" title="Pen">✏️</button>
            <button class="tool" data-tool="fill" title="Fill bucket">🪣</button>
            <button class="tool" data-tool="eraser" title="Eraser">🧽</button>
            <button class="tool" id="undoBtn" title="Undo">↩️</button>
            <button class="tool" id="clearBtn" title="Clear">🗑️</button>
          </div>
        </div>
      </main>
      <aside class="chat-col">
        <div class="chat" id="chat"></div>
        <form id="guessForm" class="guess-form" autocomplete="off">
          <input id="guessInput" maxlength="100" placeholder="Type your guess…">
          <button class="btn primary" aria-label="Send">➤</button>
        </form>
      </aside>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="words.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
